name: TeacherHasan PWA Build
on:
  push:
    branches: [redesign/puddle-pwa]
    paths:
      - "public/puddle/**"
      - "public/puddle-redesign/**"
      - "scripts/puddle-smoke.js"
      - ".github/workflows/puddle-pwa-build.yml"
  pull_request:
    paths:
      - "public/puddle/**"
      - "public/puddle-redesign/**"
      - "scripts/puddle-smoke.js"
      - ".github/workflows/puddle-pwa-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate current PWA files
        run: |
          test -s public/puddle/index.html
          test -s public/puddle/styles.css
          test -s public/puddle/app.js
          test -s public/puddle/manifest.json
          test -s public/puddle/sw.js
          node --check public/puddle/app.js
          node -e "const m=require('./public/puddle/manifest.json'); if(!m.name || !m.start_url || !m.icons?.length) process.exit(1)"
      - name: Validate redesigned web app
        run: |
          test -s public/puddle-redesign/index.html
          test -s public/puddle-redesign/styles.css
          test -s public/puddle-redesign/app.js
          test -s public/puddle-redesign/manifest.json
          test -s public/puddle-redesign/sw.js
          node --check public/puddle-redesign/app.js
          node -e "const m=require('./public/puddle-redesign/manifest.json'); if(!m.name || !m.start_url || !m.icons?.length) process.exit(1)"
          grep -q '@media' public/puddle-redesign/styles.css
          grep -q 'desktop-sidebar' public/puddle-redesign/index.html
          grep -q 'grid-template-columns:250px' public/puddle-redesign/styles.css
      - name: Package both PWA versions
        run: |
          mkdir -p build
          cp -R public/puddle build/teacherhasan-puddle
          cp -R public/puddle-redesign build/teacherhasan-puddle-redesign
          cd build
          zip -r teacherhasan-puddle-pwa.zip teacherhasan-puddle
          zip -r teacherhasan-puddle-redesign-pwa.zip teacherhasan-puddle-redesign
      - uses: actions/upload-artifact@v4
        with:
          name: teacherhasan-puddle-pwa
          path: build/*.zip
          retention-days: 14