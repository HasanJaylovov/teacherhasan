name: TeacherHasan PWA Build
on:
  push:
    branches: [redesign/puddle-pwa]
    paths: ["public/puddle-redesign/**", ".github/workflows/puddle-pwa-build-preview.yml"]
  pull_request:
    paths: ["public/puddle-redesign/**", ".github/workflows/puddle-pwa-build-preview.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PWA files
        run: |
          test -s public/puddle-redesign/index.html
          test -s public/puddle-redesign/styles.css
          test -s public/puddle-redesign/app.js
          test -s public/puddle-redesign/manifest.json
          test -s public/puddle-redesign/sw.js
          node --check public/puddle-redesign/app.js
          node -e "const m=require('./public/puddle-redesign/manifest.json'); if(!m.name || !m.start_url || !m.icons?.length) process.exit(1)"
      - name: Package PWA
        run: |
          mkdir -p build
          cp -R public/puddle-redesign build/teacherhasan-puddle-pwa
          cd build
          zip -r teacherhasan-puddle-pwa.zip teacherhasan-puddle-pwa
      - uses: actions/upload-artifact@v4
        with:
          name: teacherhasan-puddle-pwa
          path: build/teacherhasan-puddle-pwa.zip
          retention-days: 14
