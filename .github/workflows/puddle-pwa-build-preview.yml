name: TeacherHasan PWA Build
on:
  push:
    branches: [redesign/puddle-pwa]
    paths: ["public/puddle-redesign/**", "public/app.js", "public/speaking-exam.html", "server.js", "scripts/puddle-smoke.js", ".github/workflows/puddle-pwa-build-preview.yml"]
  pull_request:
    paths: ["public/puddle-redesign/**", "public/speaking-exam.html", "server.js", ".github/workflows/puddle-pwa-build-preview.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate app files
        run: |
          set -e
          for file in index.html styles.css app.js manifest.json sw.js reading.html listening.html english-practice.html cefr-assessment.html video-lessons.html; do
            test -s "public/puddle-redesign/$file"
          done
          node --check public/puddle-redesign/app.js
          node scripts/puddle-smoke.js
          node -e "const m=require('./public/puddle-redesign/manifest.json'); if(!m.name || !m.start_url || !m.icons?.length) process.exit(1)"
          grep -q 'fetch("/api/chat"' public/puddle-redesign/app.js
          grep -q 'fetch("/api/me"' public/puddle-redesign/app.js
          grep -q 'th_auth_token' public/puddle-redesign/app.js
          node --check server.js
          grep -q 'evaluated: true' server.js
          grep -q 'data.evaluated' public/speaking-exam.html
          node -e "const fs=require('fs'); const h=fs.readFileSync('public/speaking-exam.html','utf8'); const a=h.lastIndexOf('<script>')+8; const b=h.lastIndexOf('</script>'); if(a<8 || b<a) throw Error('Speaking script missing'); new Function(h.slice(a,b));"
      - name: Package PWA
        run: |
          mkdir -p build
          cp -R public/puddle-redesign build/teacherhasan-puddle-pwa
          cd build
          zip -r teacherhasan-puddle-pwa.zip teacherhasan-puddle-pwa
      - uses: actions/upload-artifact@v4
        with:
          name: teacherhasan-puddle-pwa
          path: build/teacherhasan-puddle-pwa.zip
          retention-days: 14
