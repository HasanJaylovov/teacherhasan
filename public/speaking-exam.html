</div>

<script>

const questions = {

    A1: [
        "What is your name?",
        "Where do you live?",
        "Tell me about your family.",
        "What do you do every day?",
        "What is your favorite food?"
    ],

    A2: [
        "Tell me about your hometown.",
        "What do you usually do at weekends?",
        "Describe your best friend.",
        "What did you do yesterday?",
        "What are your plans for next weekend?"
    ],

    B1: [
        "Tell me about a memorable experience in your life.",
        "What are the advantages of learning English?",
        "Describe a place you would like to visit.",
        "How has technology changed your daily life?",
        "What is an important goal you have for the future?"
    ],

    B2: [
        "What are the main advantages and disadvantages of social media?",
        "Should students use artificial intelligence for studying?",
        "Describe a difficult decision you have made.",
        "How can people become successful in their careers?",
        "What changes would you make to the education system?"
    ],

    C1: [
        "To what extent does technology improve the quality of human life?",
        "How should education respond to the development of artificial intelligence?",
        "Discuss the relationship between economic development and environmental protection.",
        "Do you think social media has strengthened or weakened human relationships?",
        "What qualities are essential for effective leadership?"
    ]

};

let selectedLevel = null;
let currentQuestion = 0;
let timerSeconds = 60;
let timerInterval = null;
let mediaRecorder = null;
let audioChunks = [];
let recordings = [];

const levelButtons =
    document.querySelectorAll(".level-btn");

const startExamBtn =
    document.getElementById("startExamBtn");

const levelSection =
    document.getElementById("levelSection");

const examSection =
    document.getElementById("examSection");

const resultSection =
    document.getElementById("resultSection");

const questionNumber =
    document.getElementById("questionNumber");

const questionText =
    document.getElementById("questionText");

const timer =
    document.getElementById("timer");

const recordBtn =
    document.getElementById("recordBtn");

const nextBtn =
    document.getElementById("nextBtn");

const examStatus =
    document.getElementById("examStatus");

levelButtons.forEach(button => {

    button.addEventListener("click", () => {

        levelButtons.forEach(btn =>
            btn.classList.remove("active")
        );

        button.classList.add("active");

        selectedLevel =
            button.dataset.level;

    });

});

startExamBtn.addEventListener("click", () => {

    if (!selectedLevel) {

        alert("Avval CEFR darajani tanlang.");

        return;

    }

    currentQuestion = 0;

    recordings = [];

    levelSection.classList.add("hidden");

    examSection.classList.remove("hidden");

    showQuestion();

});

function showQuestion() {

    const list =
        questions[selectedLevel];

    questionNumber.textContent =
        `Savol ${currentQuestion + 1} / ${list.length}`;

    questionText.textContent =
        list[currentQuestion];

    resetTimer();

    nextBtn.classList.add("hidden");

    recordBtn.classList.remove("hidden");

    examStatus.textContent =
        "Savolga javob berish uchun tugmani bosing.";

}

function resetTimer() {

    clearInterval(timerInterval);

    timerSeconds = 60;

    updateTimer();

    timerInterval = setInterval(() => {

        timerSeconds--;

        updateTimer();

        if (timerSeconds <= 0) {

            clearInterval(timerInterval);

            stopRecording();

        }

    }, 1000);

}

function updateTimer() {

    const minutes =
        String(Math.floor(timerSeconds / 60))
            .padStart(2, "0");

    const seconds =
        String(timerSeconds % 60)
            .padStart(2, "0");

    timer.textContent =
        `${minutes}:${seconds}`;

}

recordBtn.addEventListener("click", async () => {

    if (mediaRecorder &&
        mediaRecorder.state === "recording") {

        stopRecording();

        return;

    }

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });

        audioChunks = [];

        mediaRecorder =
            new MediaRecorder(stream);

        mediaRecorder.ondataavailable = event => {

            if (event.data.size > 0) {

                audioChunks.push(event.data);

            }

        };

        mediaRecorder.onstop = () => {

            const blob =
                new Blob(audioChunks, {
                    type: "audio/webm"
                });

            recordings.push({
                level: selectedLevel,
                question: questions[selectedLevel][currentQuestion],
                audio: blob
            });

            stream.getTracks().forEach(track =>
                track.stop()
            );

            recordBtn.classList.add("hidden");

            nextBtn.classList.remove("hidden");

            examStatus.textContent =
                "✅ Javob yozib olindi.";

        };

        mediaRecorder.start();

        recordBtn.textContent =
            "⏹️ Javobni tugatish";

        examStatus.textContent =
            "🔴 Yozib olinmoqda... Gapiring.";

    } catch (error) {

        console.error(error);

        alert(
            "Mikrofonga ruxsat berilmadi."
        );

    }

});

function stopRecording() {

    if (mediaRecorder &&
        mediaRecorder.state === "recording") {

        mediaRecorder.stop();

        mediaRecorder = null;

    }

}

nextBtn.addEventListener("click", () => {

    currentQuestion++;

    if (
        currentQuestion >=
        questions[selectedLevel].length
    ) {

        finishExam();

        return;

    }

    showQuestion();

});

function finishExam() {

    clearInterval(timerInterval);

    examSection.classList.add("hidden");

    resultSection.classList.remove("hidden");

    document.getElementById("resultMessage").textContent =
        `${recordings.length} ta javob yozib olindi. Keyingi bosqichda bu javoblarni Gemini AI orqali Grammar, Vocabulary, Fluency va Pronunciation bo‘yicha baholashni qo‘shamiz.`;

}

</script>

</body>
