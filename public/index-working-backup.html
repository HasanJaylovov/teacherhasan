<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Teacher Hasan AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b
                );
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 800px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 25px;
            padding: 30px;
            box-shadow:
                0 25px 70px rgba(0,0,0,0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            margin: auto;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            opacity: 0.75;
        }

        #status {
            margin: 25px 0;
            padding: 15px;
            border-radius: 12px;
            background: rgba(0,0,0,0.25);
            text-align: center;
            font-size: 16px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 15px 30px;
            font-size: 17px;
            cursor: pointer;
            font-weight: bold;
        }

        #startBtn {
            background: #22c55e;
            color: white;
        }

        #stopBtn {
            background: #ef4444;
            color: white;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .transcript-title {
            margin-bottom: 10px;
        }

        #transcript {
            min-height: 250px;
            max-height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: rgba(0,0,0,0.25);
            border-radius: 15px;
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">

        <div class="avatar">
            👨‍🏫
        </div>

        <h1>
            Teacher Hasan
        </h1>

        <div class="subtitle">
            🇺🇿 O‘zbek tilida AI English Teacher
        </div>

    </div>


    <div id="status">
        ⚪ Tayyor. Start tugmasini bosing.
    </div>


    <div class="buttons">

        <button
            id="startBtn"
            type="button"
        >
            🎤 Start
        </button>

        <button
            id="stopBtn"
            type="button"
            disabled
        >
            🔴 Stop
        </button>

    </div>


    <h2 class="transcript-title">
        📝 Suhbat transkripti
    </h2>


    <div id="transcript">
        Teacher Hasan bilan suhbat shu yerda ko‘rinadi...
    </div>

</div>



<script type="module" src="/app.js"></script>
</body>

</html>
