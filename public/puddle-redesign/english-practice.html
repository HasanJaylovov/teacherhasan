<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3efff"><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./styles.css"><title>Ingliz tili mashqlari | Teacher Hasan AI</title></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="./index.html"><span class="brand-mark">🎓</span><span><b>Teacher Hasan <em>AI</em></b><small>Ingliz tili mashqlari</small></span></a><a class="icon-btn" href="./index.html" style="display:grid;place-items:center">⌂</a></header><section class="view active"><div class="page-title"><p class="eyebrow">KUNLIK MASHQ</p><h1>Grammatika sinovi ✍️</h1><p class="muted">10 ta savol · Javoblaringizni tekshiring</p></div><div class="list-card" style="padding:20px"><div class="progress-track"><span id="progress" style="width:0%"></span></div><p id="counter" class="muted">1 / 10</p><h2 id="question" style="font-size:19px;margin:14px 0">She ___ to school every day.</h2><div id="answers" style="display:grid;gap:10px"></div><p id="feedback" role="status" class="muted" style="min-height:25px;margin-top:14px"></p><button id="next" class="primary-btn" style="border:0;background:linear-gradient(120deg,#7040ef,#9a72ff);color:white" disabled>Keyingi savol →</button><div id="result" hidden></div></div><p style="margin:20px 2px"><a class="primary-btn" href="/">🎙️ AI ustoz bilan tushuntirish</a></p></section></div><script>
const qs=[["She ___ to school every day.",["go","goes","going","gone"],1,"Present Simple: he/she/it bilan fe’lga -s qo‘shiladi."],["They ___ watching TV now.",["is","am","are","be"],2,"Present Continuous: they + are + verb-ing."],["I ___ my homework yesterday.",["do","did","done","does"],1,"Past Simple: yesterday bilan o‘tgan zamon — did."],["There ___ two books on the table.",["is","are","am","be"],1,"Two books ko‘plik, shuning uchun are."],["If I ___ time, I will call you.",["have","had","has","having"],0,"First Conditional: If + Present Simple, will + verb."],["She has lived here ___ 2020.",["for","since","during","from"],1,"Since aniq boshlanish vaqtini bildiradi."],["This is the ___ film I have ever seen.",["good","better","best","well"],2,"The best — orttirma daraja."],["You ___ wear a seat belt.",["should","would","could to","are"],0,"Should maslahat yoki tavsiya bildiradi."],["The letter ___ yesterday.",["sent","was sent","is send","has send"],1,"Passive Voice: was/were + past participle."],["By next year, I ___ my course.",["finish","finished","will have finished","am finish"],2,"Future Perfect: will have + V3."]];
let n=0,score=0,locked=false;const q=document.getElementById("question"),a=document.getElementById("answers"),f=document.getElementById("feedback"),next=document.getElementById("next");function render(){locked=false;next.disabled=true;f.textContent="";document.getElementById("counter").textContent=(n+1)+" / "+qs.length;document.getElementById("progress").style.width=(n/qs.length*100)+"%";q.textContent=qs[n][0];a.innerHTML="";qs[n][1].forEach((v,i)=>{const b=document.createElement("button");b.className="suggestion";b.style.cssText="border-radius:13px;text-align:left;padding:13px";b.textContent=String.fromCharCode(65+i)+". "+v;b.onclick=()=>{if(locked)return;locked=true;const ok=i===qs[n][2];if(ok)score++;f.textContent=(ok?"To‘g‘ri! 🎉 ":"Xato. ")+qs[n][3];f.style.color=ok?"#159b70":"#ba6948";[...a.children].forEach((x,j)=>{x.disabled=true;if(j===qs[n][2])x.style.borderColor="#26b58a";});next.disabled=false;next.textContent=n===qs.length-1?"Natijani ko‘rish":"Keyingi savol →";};a.appendChild(b);});}next.onclick=()=>{if(n<qs.length-1){n++;render();}else{document.querySelector(".list-card").innerHTML="<h2>Mashq yakunlandi 🎉</h2><p style='margin:12px 0'>Natijangiz: <b>"+score+" / "+qs.length+"</b></p><p class='muted'>Bu mashq natijasi o‘quv mashqi uchun. Rasmiy CEFR bahosi emas.</p><button class='primary-btn' onclick='location.reload()'>Qayta urinib ko‘ring</button>";}};render();</script></body></html>
