<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3efff"><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./styles.css"><title>CEFR Assessment | Teacher Hasan AI</title></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="./index.html"><span class="brand-mark">🎓</span><span><b>Teacher Hasan <em>AI</em></b><small>Level check</small></span></a><a class="icon-btn" href="./index.html" style="display:grid;place-items:center">⌂</a></header><section class="view active"><div class="page-title"><p class="eyebrow">QUICK LEVEL CHECK</p><h1>CEFR Assessment 🏆</h1><p class="muted">10 savolli dastlabki grammar/vocabulary diagnostikasi.</p></div><div class="list-card" style="padding:20px"><p class="muted">Eslatma: bu qisqa diagnostika. Rasmiy CEFR sertifikati yoki to‘liq Reading, Listening, Writing, Speaking baholashi emas.</p><div class="progress-track"><span id="progress" style="width:0%"></span></div><p id="counter" class="muted">1 / 10</p><h2 id="question" style="font-size:19px;margin:14px 0"></h2><div id="answers" style="display:grid;gap:10px"></div><p id="feedback" role="status" class="muted" style="min-height:25px"></p><button id="next" class="primary-btn" style="border:0;background:linear-gradient(120deg,#7040ef,#9a72ff);color:white" disabled>Next →</button></div><p style="margin:20px 2px"><a class="primary-btn" href="/speaking-exam.html">🗣️ Speaking Exam</a></p></section></div><script>
const qs=[["I ___ a student.",["am","is","are","be"],0],["She ___ coffee every morning.",["drink","drinks","drinking","drank"],1],["We ___ to Samarkand last year.",["go","gone","went","going"],2],["I have lived here ___ five years.",["since","for","at","from"],1],["If it rains, we ___ at home.",["stay","stayed","will stay","staying"],2],["This problem is ___ than the last one.",["difficult","more difficult","most difficult","the difficult"],1],["By the time I arrived, they ___ .",["leave","left","had left","have leave"],2],["The project ___ by the team now.",["is being completed","completes","has completing","was complete"],0],["Had I known, I ___ you.",["will help","would have helped","help","helped"],1],["The proposal, ___ was discussed yesterday, has been approved.",["who","where","which","whose"],2]];
let n=0,score=0,locked=false;const q=document.getElementById("question"),a=document.getElementById("answers"),f=document.getElementById("feedback"),next=document.getElementById("next");function render(){locked=false;next.disabled=true;f.textContent="";document.getElementById("counter").textContent=(n+1)+" / 10";document.getElementById("progress").style.width=(n*10)+"%";q.textContent=qs[n][0];a.innerHTML="";qs[n][1].forEach((v,i)=>{const b=document.createElement("button");b.className="suggestion";b.style.cssText="border-radius:13px;text-align:left;padding:13px";b.textContent=String.fromCharCode(65+i)+". "+v;b.onclick=()=>{if(locked)return;locked=true;if(i===qs[n][2])score++;f.textContent=i===qs[n][2]?"Correct!":"Correct answer: "+qs[n][1][qs[n][2]];f.style.color=i===qs[n][2]?"#159b70":"#ba6948";[...a.children].forEach((x,j)=>{x.disabled=true;if(j===qs[n][2])x.style.borderColor="#26b58a";});next.disabled=false;next.textContent=n===9?"View result":"Next →";};a.appendChild(b);});}next.onclick=()=>{if(n<9){n++;render();return;}const level=score<3?"A1–A2":score<6?"A2–B1":score<8?"B1–B2":"B2–C1";document.querySelector(".list-card").innerHTML="<h2>Preliminary result</h2><div style='font-size:42px;color:#7040ef;font-weight:800;margin:12px 0'>"+level+"</div><p>You scored "+score+" / 10.</p><p class='muted' style='margin:12px 0'>Bu faqat taxminiy grammar/vocabulary ko‘rsatkichi. To‘liq CEFR darajasi uchun barcha ko‘nikmalar tekshirilishi kerak.</p><a class='primary-btn' href='/speaking-exam.html'>Speaking imtihonini boshlash</a>";};render();</script></body></html>
