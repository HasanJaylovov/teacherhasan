<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parolni almashtirish — Teacher Hasan</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:
        radial-gradient(circle at top left,#243b80,transparent 35%),
        radial-gradient(circle at bottom right,#5d2f8e,transparent 35%),
        #080b16;
    color:white;
}
.card{
    width:100%;
    max-width:480px;
    padding:32px;
    border-radius:26px;
    background:rgba(15,20,35,.9);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 30px 80px rgba(0,0,0,.45);
}
h1{margin:0 0 8px}
p{color:#aeb7d0;line-height:1.5}
label{
    display:block;
    margin:18px 0 7px;
    font-size:13px;
    font-weight:700;
}
input{
    width:100%;
    padding:14px 15px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.06);
    color:white;
    outline:none;
}
button{
    width:100%;
    margin-top:22px;
    padding:15px;
    border:0;
    border-radius:14px;
    color:white;
    background:linear-gradient(135deg,#667eea,#764ba2);
    font-weight:800;
    font-size:15px;
    cursor:pointer;
}
.message{
    margin-top:15px;
    padding:12px;
    border-radius:12px;
    display:none;
}
.error{
    background:rgba(255,70,70,.12);
    color:#ffb0b0;
}
.success{
    background:rgba(70,220,140,.12);
    color:#9ff0c5;
}
</style>
</head>
<body>
<div class="card">
    <h1>🔐 Parolni almashtirish</h1>
    <p>Yangi parolingizni kiriting.</p>

    <div id="message" class="message"></div>

    <form id="form">
        <label>YANGI PAROL</label>
        <input
            id="password"
            type="password"
            minlength="6"
            required
            placeholder="Kamida 6 belgi"
        >

        <label>PAROLNI TAKRORLANG</label>
        <input
            id="confirm"
            type="password"
            minlength="6"
            required
            placeholder="Parolni takrorlang"
        >

        <button>
            PAROLNI ALMASHTIRISH
        </button>
    </form>
</div>

<script>
const params = new URLSearchParams(location.search);
const token = params.get("token") || "";

const form = document.getElementById("form");
const message = document.getElementById("message");

function show(text, ok=false){
    message.textContent = text;
    message.className = "message " + (ok ? "success" : "error");
    message.style.display = "block";
}

form.onsubmit = async (e)=>{
    e.preventDefault();

    const password =
        document.getElementById("password").value;

    const confirm =
        document.getElementById("confirm").value;

    if(!token){
        show("Parolni tiklash tokeni topilmadi.");
        return;
    }

    if(password.length < 6){
        show("Parol kamida 6 belgidan iborat bo‘lishi kerak.");
        return;
    }

    if(password !== confirm){
        show("Parollar bir xil emas.");
        return;
    }

    try{
        const response = await fetch(
            "/api/auth/reset-password",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    token,
                    password
                })
            }
        );

        const data =
            await response.json().catch(()=>({}));

        if(!response.ok){
            throw new Error(
                data.error ||
                "Parolni almashtirishda xatolik."
            );
        }

        show(
            "Parolingiz muvaffaqiyatli almashtirildi. Endi yangi parol bilan kirishingiz mumkin.",
            true
        );

        form.reset();

    }catch(error){
        show(error.message);
    }
};
</script>
</body>
</html>
